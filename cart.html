<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Imelda’s Bracelets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Imelda's Bracelets home">
        <span class="brand-mark" aria-hidden="true">IB</span>
        <span class="brand-copy">
          <span class="brand-name">Imelda's Bracelets</span>
          <span class="brand-tagline">Handmade bracelet studio</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a class="nav-cart" href="cart.html">Cart <span class="cart-count" aria-label="Items in cart">0</span></a>
        <a class="nav-admin" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-heading">
      <p class="eyebrow">Your cart</p>
      <h1>Ready to checkout?</h1>
      <p class="section-copy">Review your bracelet selection and continue to a simple checkout form.</p>
    </section>

    <section class="cart-section">
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-summary">
        <h2>Summary</h2>
        <p id="cart-total">Total: $0.00</p>
        <a class="button button-primary" href="checkout.html">Proceed to checkout</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Imelda’s Bracelets — Friendly, fun shopping.</p>
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
